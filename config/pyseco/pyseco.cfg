# pyseco settings. ${TMF_...} values come from .env.
url=tmserver
port=5000

username_superadmin=SuperAdmin
password_superadmin=${TMF_SUPERADMIN_PASSWORD}

username_admin=Admin
password_admin=${TMF_ADMIN_PASSWORD}

username_user=User
password_user=${TMF_USER_PASSWORD}

log_path=/data/logs
log_level=3

# comma separated, available: ad, custom_votes, discord, echo
# (custom_votes and ad overlap with XAseco, so only discord runs next to it)
plugins=discord

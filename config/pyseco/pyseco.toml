# pyseco settings, ${TMF_...} values come from .env. See pyseco.toml.example in pyseco for all options.

[server]
host = "tmserver"
port = 5000
login = "SuperAdmin"
password = "${TMF_SUPERADMIN_PASSWORD}"

[controller]
# more roles are given in game: /setrole <login> <player|operator|admin>
masteradmins = ["${TMF_MASTERADMIN_LOGIN}"]
# available: ad, custom_votes, discord, echo, jukebox
# (ad overlaps with XAseco; jukebox replaces XAseco's jukebox, custom_votes its /skip and /replay votes)
plugins = ["discord", "jukebox", "custom_votes"]
data_dir = "/data"
log_level = "info"

[discord]
token = "${TMF_DISCORD_TOKEN}"
channel_id = ${TMF_DISCORD_CHANNEL_ID}
invite = "${TMF_DISCORD_INVITE}"
prefix = "!"

[jukebox]
# players can't wish one of the last <recent> maps; entries per player at a time (operators and above: no limit)
recent = 10
per_player = 1

[custom_votes]
# /skip and /replay votes: duration in ms, share of yes votes needed
timeout = 30000
ratio = 0.5
